name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Native modules (usb, better-sqlite3, sharp) are allowed to build via allowBuilds in pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile

      # The client ships a copy of the API's route types. If a route changed without regenerating it, fail here
      # rather than publish a client that disagrees with the server.
      - name: Client route types are up to date
        run: |
          pnpm --filter @moonthug/p0s-client generate
          git diff --exit-code packages/client/src/generated || {
            echo "::error::Route types are stale. Run: pnpm --filter @moonthug/p0s-client generate"
            exit 1
          }

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      # The API tests use the fake printer and a temporary SQLite file; no hardware or services needed.
      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @p0s/web build

  docker:
    name: Docker image (${{ matrix.app }})
    needs: check
    # The images run on a Raspberry Pi: build and smoke-test them natively on GitHub's ARM runners (no emulation).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, web]

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/p0s-${{ matrix.app }}
      # Only main publishes; pull requests just prove the image builds and starts.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build once into the local daemon so it can be started before anything is published.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          load: true
          tags: p0s-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The API's native modules (usb, better-sqlite3, sharp) only show problems when the image starts.
      - name: Smoke test
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then
            docker run -d --name smoke -p 3000:3000 -e PRINTER=fake p0s-api:ci
            url=http://localhost:3000/status
          else
            docker run -d --name smoke -p 8080:80 --add-host api:127.0.0.1 p0s-web:ci
            url=http://localhost:8080/
          fi

          for i in $(seq 1 30); do
            if curl -fsS "$url" > /dev/null; then echo "ok: $url"; exit 0; fi
            sleep 1
          done

          docker logs smoke
          exit 1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build again from the cache, now tagged and pushed.
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

  publish-client:
    name: Publish @moonthug/p0s-client
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # registry-url writes an .npmrc that authenticates GitHub Packages with NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@moonthug"

      - run: pnpm install --frozen-lockfile

      # Publishing is driven by the version in packages/client/package.json: bump it to release.
      - name: Is this version already published?
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/client/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "@moonthug/p0s-client@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@moonthug/p0s-client@$version is already published; bump the version to release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds dist; pnpm applies publishConfig (registry, and exports pointing at dist).
      - name: Publish
        if: steps.version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @moonthug/p0s-client publish --no-git-checks
